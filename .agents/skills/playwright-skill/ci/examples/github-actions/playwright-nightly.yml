# The full regression suite on a schedule, with a Slack message when it fails.
# Use when: the full suite is too slow for every pull request; Avoid when: it runs in under ~15 minutes.
# `schedule` runs on the default branch only. Create the incoming webhook in Slack and store its URL as a secret.
# Every `uses:` is a full commit SHA with its version in the comment, so a moved tag cannot change
# what runs. Dependabot (`package-ecosystem: github-actions`) keeps them current. GitHub sets
# `CI=true` itself. Look up a SHA with:  git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>*'
name: Nightly Regression

on:
  schedule:
    - cron: '0 3 * * 1-5' # 03:00 UTC, Monday to Friday
  workflow_dispatch: # run it by hand

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # the active LTS; or `node-version-file: .nvmrc` to follow the project
          cache: npm

      - run: npm ci

      - name: Install browsers and OS dependencies
        run: npx playwright install --with-deps

      - name: Run the full regression suite
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
        run: npx playwright test --grep @regression

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Tell Slack
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Nightly Playwright regression failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
