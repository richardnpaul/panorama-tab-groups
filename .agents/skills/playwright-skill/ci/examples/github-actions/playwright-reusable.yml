# One Playwright job that other workflows call (see playwright-reusable-caller.yml).
# Use when: several workflows or repositories need the same setup; Avoid when: there is one workflow.
# Inputs reach the shell only through `env:`, never by writing `${{ inputs.x }}` inside `run:`, which would
# let the caller's text become part of the script.
# Every `uses:` is a full commit SHA with its version in the comment, so a moved tag cannot change
# what runs. Dependabot (`package-ecosystem: github-actions`) keeps them current. GitHub sets
# `CI=true` itself. Look up a SHA with:  git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>*'
name: Playwright Reusable

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      shards:
        description: JSON list of shards, for example '["1/4","2/4","3/4","4/4"]'
        type: string
        default: '["1/1"]'
      project:
        description: A Playwright project to run; empty runs all of them
        type: string
        default: ''
      base-url:
        type: string
        default: ''
    secrets:
      TEST_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install browsers and OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      # The browsers come from the cache; the OS packages they need do not
      - name: Install OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run tests (shard ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
          PROJECT: ${{ inputs.project }}
          BASE_URL: ${{ inputs.base-url }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test --shard="$SHARD" ${PROJECT:+--project="$PROJECT"}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 14
