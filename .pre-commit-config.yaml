repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-illegal-windows-names
      - id: check-executables-have-shebangs
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
      - id: check-yaml

  # Workflow syntax, expressions, inputs and shell quoting; no Docker needed
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or: [javascript, ts, json, css, html, markdown]

      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        types: [file]
        files: \.(js|mjs|ts|json)$

      - id: no-suppressions
        name: no suppressions
        entry: npx tsx scripts/check-no-suppressions.ts
        language: system
        pass_filenames: false
        always_run: true
