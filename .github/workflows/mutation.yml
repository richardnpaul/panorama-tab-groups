name: Mutation tests

permissions:
  contents: read

# Pull requests test only what changed since the last full run, which is kept
# in the cache. `main` and the nightly run test everything, so the cache cannot
# hide a survivor.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

# A pull request's run gives way to a newer push; the full runs, whose report
# the cache keeps, always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore the incremental report
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Test the changes
        if: github.event_name == 'pull_request'
        run: npm run test:mutation

      - name: Test everything
        if: github.event_name != 'pull_request'
        run: npm run test:mutation:full

      - name: Keep the incremental report
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 5
