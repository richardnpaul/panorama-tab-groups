version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Deliberate pins: see docs/plans/hexagonal-core-and-mutation-testing.md
      # (Vitest 5 silently breaks the Stryker runner; TypeScript 7 has no JS API
      # for Stryker's checker)
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@stryker-mutator/*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # The pre-commit hooks, whose `rev` is a commit
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly

  # The base image of the devcontainer, which is pinned by digest
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
